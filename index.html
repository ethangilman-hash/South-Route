<style>
:root{--bg:#f3f4f6;--panel:#fff;--text:#27282a;--muted:#76797f;--primary:#0172f0;--navy:#1e164b;--border:#e8e9ee;--sh:0 3px 12px 1px rgb(38 38 38 / 10%)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Inter,Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);padding:20px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mk{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#00bbc8,var(--primary));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
h1{margin:0;font-size:18px;font-weight:600} .sub{color:var(--muted);font-size:13px;margin:6px 0 18px;line-height:1.45}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:var(--muted)}
button{width:100%;background:var(--primary);color:#fff;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#e4002b;font-size:13px;margin-top:10px;min-height:1.2em}
.foot{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.45}
</style></head><body>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var RK='eastRouteUnlockV1';
  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  async function derive(pw,salt,iter){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function unlock(pw){
    var key=await derive(pw,b64(P.salt),P.iter);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  async function show(html){
    document.open(); document.write(html); document.close();
  }
  var f=document.getElementById('f'), err=document.getElementById('err'), go=document.getElementById('go');
  f.addEventListener('submit',async function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Unlocking…';
    try{
      var pw=document.getElementById('pw').value;
      var html=await unlock(pw);
      if(document.getElementById('rem').checked){try{localStorage.setItem(RK,pw);}catch(x){}}
      await show(html);
    }catch(ex){err.textContent='Wrong password or corrupted page.'; go.disabled=false; go.textContent='Unlock';}
  });
  try{
    var sp=localStorage.getItem(RK);
    if(sp){go.disabled=true;go.textContent='Unlocking…'; unlock(sp).then(show).catch(function(){localStorage.removeItem(RK);go.disabled=false;go.textContent='Unlock';});}
  }catch(x){}
})();
</script>
